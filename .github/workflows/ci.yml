name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.task }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        task: [nvim:test:stable, nvim:test:nightly]
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - { task: go:fix, os: ubuntu-latest }
          - { task: go:format, os: ubuntu-latest }
          - { task: go:vulncheck, os: ubuntu-latest }
          - { task: md:lint, os: ubuntu-latest }
          - { task: lua:format, os: ubuntu-latest }
          - { task: query:format, os: ubuntu-latest }
          - { task: query:lint, os: ubuntu-latest }
          - { task: docs:build, os: ubuntu-latest }
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - if: matrix.task == 'nvim:test:nightly'
        run: mise install --force neovim@nightly
      - run: mise run ${{ matrix.task }}
      - run: git diff --exit-code
