[settings]
lockfile = true
minimum_release_age = "3d"

[tools]
go = "1.27.4"
golangci-lint = "2.14.0"
gotestsum = "1.13.0"
python = "3.14"
rumdl = "0.2.52"
stylua = "2.5.2"
tree-sitter = "0.26.11"
uv = "0.13.0"
"github:ribru17/ts_query_ls" = "3.16.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.8.0"
"pypi:zensical" = "0.0.53"

[vars]
go_modules = "tests/go tests/features tests/features/submodule"
query_dirs = "lua/neotest-golang/queries lua/neotest-golang/features/testify/queries"

# Go (test fixtures)

[tasks."go:fix"]
description = "Update Go test fixtures for newer Go versions"
run = 'for d in {{vars.go_modules}}; do (cd "$d" && go fix ./...) || exit 1; done'

[tasks."go:format"]
description = "Format Go test fixtures"
run = 'for d in {{vars.go_modules}}; do (cd "$d" && golangci-lint fmt ./...) || exit 1; done'

[tasks."go:vulncheck"]
description = "Check Go test fixtures for known vulnerabilities"
run = 'for d in {{vars.go_modules}}; do (cd "$d" && govulncheck ./...) || exit 1; done'

# Markdown

[tasks."md:lint"]
description = "Lint Markdown files, with fixes"
run = "rumdl check --fix ."

# Lua

[tasks."lua:format"]
description = "Format Lua files"
run = "stylua ."

# Tree-sitter queries

[tasks."query:parser"]
description = "Build the tree-sitter Go parser used by ts_query_ls"
hide = true
run = '''
# Revision pinned by nvim-treesitter (main), lua/nvim-treesitter/parsers.lua.
rev=2346a3ab1bb3857b48b29d779a1ef9799a248cd7
out=.tests/all/site/parser/go.so
[ -f "$out" ] && exit 0
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
git -C "$tmp" init --quiet
git -C "$tmp" fetch --depth 1 --quiet https://github.com/tree-sitter/tree-sitter-go "$rev"
git -C "$tmp" checkout --quiet FETCH_HEAD
mkdir -p "$(dirname "$out")"
tree-sitter build -o "$out" "$tmp"
'''

[tasks."query:format"]
description = "Format tree-sitter query files"
depends = ["query:parser"]
run = "ts_query_ls format {{vars.query_dirs}}"

[tasks."query:lint"]
description = "Lint tree-sitter query files"
depends = ["query:parser"]
run = "ts_query_ls check {{vars.query_dirs}}"

# Docs

[tasks."docs:build"]
description = "Build documentation"
run = "zensical build"

[tasks."docs:serve"]
description = "Serve documentation locally"
run = "zensical serve"

# Neovim

[tasks."nvim:test:stable"]
description = "Run plenary tests with stable Neovim"
alias = "test"
tools = { neovim = "0.12.6" }
usage = 'arg "[path]" help="Spec file or directory" default="spec/"'
run = "nvim -l spec/run.lua .tests/stable {{usage.path}}"

# Nightly changes daily, so it stays out of mise.lock.
[tasks."nvim:test:nightly"]
description = "Run plenary tests with nightly Neovim"
env = { MISE_LOCKFILE = "false" }
usage = 'arg "[path]" help="Spec file or directory" default="spec/"'
run = "mise exec neovim@nightly -- nvim -l spec/run.lua .tests/nightly {{usage.path}}"

# Tasks that write files run one at a time; read-only checks in parallel.
[tasks.default]
description = "Run all checks"
run = [
  { task = "go:fix" },
  { task = "go:format" },
  { task = "md:lint" },
  { task = "lua:format" },
  { task = "query:format" },
  { task = "query:lint" },
  { tasks = [
    "go:vulncheck",
    "docs:build",
    "nvim:test:stable",
    "nvim:test:nightly",
  ] },
]
